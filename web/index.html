<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's That Pokémon?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>Who's that <span class="em">Pokémon</span>?</h1>
    <p class="sub">Drop in a picture of any of the original 151 and the model will name it. Trained from scratch on ~15,000 images.</p>
  </header>

  <div class="cols">

    <section class="panel">
      <div class="drop" id="drop" tabindex="0" role="button"
           aria-label="Choose an image, or drag one here">
        <div class="drop-inner" id="dropInner">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M7 10l5-5 5 5"/><path d="M12 5v13"/>
          </svg>
          <strong>Drop an image here</strong>
          <small>or click to browse &middot; or paste with Ctrl&#8202;+&#8202;V</small>
        </div>
        <div class="stage" id="stage" hidden></div>
        <p class="stage-hint" id="stageHint" hidden>drag to rotate &middot; scroll to zoom</p>
      </div>
      <input type="file" id="file" accept="image/*" class="sr-only">
      <p class="filename" id="filename"></p>
      <div class="actions">
        <button class="btn-primary" id="identify" disabled>Identify</button>
        <button class="btn-ghost" id="toggle3d" hidden>Show photo</button>
        <button class="btn-ghost" id="clear" hidden>Clear</button>
      </div>
    </section>

    <section class="panel result" id="result" aria-live="polite">
      <div class="placeholder" id="placeholder">The answer will appear here.</div>
    </section>

  </div>

  <footer id="meta"></footer>
</div>

<script>
(function () {
  const drop = document.getElementById('drop');
  const dropInner = document.getElementById('dropInner');
  const fileInput = document.getElementById('file');
  const filenameEl = document.getElementById('filename');
  const identifyBtn = document.getElementById('identify');
  const clearBtn = document.getElementById('clear');
  const result = document.getElementById('result');
  const meta = document.getElementById('meta');

  const BARS = ['var(--bar1)', 'var(--bar2)', 'var(--bar3)', 'var(--bar4)', 'var(--bar5)'];

  // The palette is a presentation concern, so it lives here rather than in the
  // API response - the server sends type NAMES, the page decides what they look
  // like. Gen 1 only uses 15 of these; the rest are here so nothing breaks if
  // this is ever pointed at a later generation.
  const TYPE_COLORS = {
    Normal:'#A8A77A', Fire:'#EE8130', Water:'#6390F0', Electric:'#F7D02C',
    Grass:'#7AC74C', Ice:'#96D9D6', Fighting:'#C22E28', Poison:'#A33EA1',
    Ground:'#E2BF65', Flying:'#A98FF3', Psychic:'#F95587', Bug:'#A6B91A',
    Rock:'#B6A136', Ghost:'#735797', Dragon:'#6F35FC', Dark:'#705746',
    Steel:'#B7B7CE', Fairy:'#D685AD'
  };

  function rgbOf(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  }
  function rgba(hex, a) {
    const [r, g, b] = rgbOf(hex);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  // Half the type colours are pale (Electric, Ice, Steel) and half are dark.
  // Perceived luminance picks the readable text colour instead of hardcoding
  // white and hoping.
  function readableOn(hex) {
    const [r, g, b] = rgbOf(hex);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14161c' : '#ffffff';
  }
  function isDark() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches &&
           document.documentElement.dataset.theme !== 'light';
  }
  // Dual types get one bloom each; single types reuse the same hue at two
  // different sizes so it still reads as a gradient rather than a flat wash.
  function paintBackground(types) {
    const a = TYPE_COLORS[types && types[0]] || null;
    const b = TYPE_COLORS[types && types[1]] || a;
    const alpha = isDark() ? 0.32 : 0.45;
    document.body.style.setProperty('--type-a', a ? rgba(a, alpha) : 'transparent');
    document.body.style.setProperty('--type-b', b ? rgba(b, alpha * 0.8) : 'transparent');
    fx.set(types);
  }


  // ---- particle field ---------------------------------------------------
  // Hand-rolled rather than a particle library, for three reasons: the page is
  // deliberately one dependency-free file, the per-type motion models are
  // genuinely different (embers accelerate upward, bubbles wobble on a sine,
  // arcs are pre-generated polylines that flash) so a generic emitter would be
  // fought more than configured, and a library big enough to do all of it is
  // larger than the entire rest of this page.
  //
  // Each behaviour supplies spawn/step/draw. The engine owns the canvas, the
  // frame loop, the particle pool and the crossfade; behaviours own nothing but
  // their own physics. Adding a new one is ~10 lines and touches nothing else.
  const FX_FOR_TYPE = {
    Fire:'embers', Water:'bubbles', Electric:'arcs',
    Grass:'leaves', Bug:'leaves',
    Ice:'snow', Fairy:'sparkles', Psychic:'orbs',
    Ghost:'wisps', Poison:'wisps', Dark:'wisps',
    Rock:'motes', Ground:'motes', Steel:'motes', Normal:'motes',
    Flying:'streaks', Dragon:'streaks', Fighting:'streaks'
  };

  const fx = (function () {
    const canvas = document.createElement('canvas');
    canvas.id = 'fx';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let W = 0, H = 0, parts = [], kind = null, colors = ['#888'], raf = null, swap = null;
    const TAU = Math.PI * 2;
    const rnd = (a, b) => a + Math.random() * (b - a);
    // Fade in over the first sixth of a particle's life and out over the last
    // sixth, full strength in between. A plain 1-life/max ramp means a field
    // that has been warmed up is mostly half-dead and barely visible.
    const ease = p => { const t = p.life / p.max; return Math.max(0, Math.min(1, t * 6, (1 - t) * 6)); };

    function resize() {
      // Draw at device resolution but lay out in CSS pixels, or everything is
      // blurry on a retina/scaled display.
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const B = {
      // Fire - embers rising, accelerating, flickering out.
      embers: {
        count: 54, blend: 'lighter',
        spawn(p) {
          p.x = rnd(0, W); p.y = H + rnd(0, H * 0.25);
          p.r = rnd(1.6, 4.4); p.vy = -rnd(0.3, 1.0); p.vx = rnd(-0.2, 0.2);
          p.max = rnd(220, 470); p.life = 0; p.ph = rnd(0, TAU);
        },
        step(p) {
          p.life++;
          p.vy -= 0.0016;                                  // heat rises faster over time
          p.x += p.vx + Math.sin(p.life * 0.02 + p.ph) * 0.4;
          p.y += p.vy;
          return p.life < p.max && p.y > -30;
        },
        draw(p) {
          const k = ease(p);
          const flick = 0.6 + 0.4 * Math.sin(p.life * 0.3 + p.ph);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (0.55 + k * 0.45), 0, TAU);
          ctx.fillStyle = rgba(p.c, (isDark() ? 0.62 : 0.85) * k * flick);
          ctx.fill();
        }
      },

      // Water - bubbles rising on a sine, thinning as they go.
      bubbles: {
        count: 34, blend: 'source-over',
        spawn(p) {
          p.x0 = rnd(0, W); p.x = p.x0; p.y = H + rnd(10, H * 0.3);
          p.r = rnd(3, 12); p.vy = -rnd(0.25, 0.7);
          p.max = rnd(320, 620); p.life = 0; p.ph = rnd(0, TAU); p.amp = rnd(6, 20);
        },
        step(p) {
          p.life++;
          p.y += p.vy;
          p.x = p.x0 + Math.sin(p.life * 0.025 + p.ph) * p.amp;
          return p.life < p.max && p.y > -30;
        },
        draw(p) {
          const k = ease(p);
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.strokeStyle = rgba(p.c, 0.75 * k); ctx.lineWidth = 1.6; ctx.stroke();
          ctx.fillStyle = rgba(p.c, 0.12 * k); ctx.fill();
          ctx.beginPath();                                  // little specular highlight
          ctx.arc(p.x - p.r * 0.33, p.y - p.r * 0.33, p.r * 0.22, 0, TAU);
          ctx.fillStyle = rgba('#ffffff', 0.4 * k); ctx.fill();
        }
      },

      // Electric - jagged polylines that flash for a few frames, on a stagger so
      // they never all fire at once. Negative life is the pre-strike delay.
      arcs: {
        count: 22, blend: 'lighter',
        spawn(p) {
          const n = 4 + ((Math.random() * 4) | 0);
          let cx = rnd(0, W), cy = rnd(-40, H * 0.65);
          p.pts = [];
          for (let i = 0; i < n; i++) {
            p.pts.push([cx, cy]);
            cx += rnd(-55, 55); cy += rnd(22, 62);
          }
          p.life = -((Math.random() * 75) | 0);             // stagger the strikes
          p.max = rnd(9, 22); p.w = rnd(0.9, 2.4);
        },
        step(p) { p.life++; return p.life < p.max; },
        draw(p) {
          if (p.life < 0) return;                           // still waiting to strike
          const k = 1 - p.life / p.max;
          const flick = Math.random() > 0.25 ? 1 : 0.35;    // unstable, like a real arc
          ctx.beginPath();
          ctx.moveTo(p.pts[0][0], p.pts[0][1]);
          for (let i = 1; i < p.pts.length; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
          ctx.strokeStyle = rgba(p.c, 0.85 * k * flick);
          ctx.lineWidth = p.w; ctx.lineCap = 'round'; ctx.stroke();
        }
      },

      // Grass / Bug - leaves tumbling down, swaying, spinning.
      leaves: {
        count: 30, blend: 'source-over',
        spawn(p) {
          p.x0 = rnd(0, W); p.x = p.x0; p.y = rnd(-H * 0.3, -10);
          p.r = rnd(4, 9); p.vy = rnd(0.25, 0.7);
          p.rot = rnd(0, TAU); p.vr = rnd(-0.03, 0.03);
          p.max = rnd(420, 760); p.life = 0; p.ph = rnd(0, TAU); p.amp = rnd(12, 40);
        },
        step(p) {
          p.life++; p.y += p.vy; p.rot += p.vr;
          p.x = p.x0 + Math.sin(p.life * 0.018 + p.ph) * p.amp;
          return p.life < p.max && p.y < H + 30;
        },
        draw(p) {
          const k = ease(p);
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.42, 0, 0, TAU);
          ctx.fillStyle = rgba(p.c, 0.7 * k); ctx.fill();
          ctx.restore();
        }
      },

      // Ice - snow, straight down with a slow drift.
      snow: {
        count: 60, blend: 'source-over',
        spawn(p) {
          p.x0 = rnd(0, W); p.x = p.x0; p.y = rnd(-H * 0.4, -5);
          p.r = rnd(1, 3.2); p.vy = rnd(0.25, 0.85);
          p.max = rnd(500, 900); p.life = 0; p.ph = rnd(0, TAU); p.amp = rnd(5, 22);
        },
        step(p) {
          p.life++; p.y += p.vy;
          p.x = p.x0 + Math.sin(p.life * 0.012 + p.ph) * p.amp;
          return p.life < p.max && p.y < H + 20;
        },
        draw(p) {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fillStyle = rgba(p.c, 0.8 * ease(p)); ctx.fill();
        }
      },

      // Fairy - four-point twinkles that bloom and vanish in place.
      sparkles: {
        count: 40, blend: 'lighter',
        spawn(p) {
          p.x = rnd(0, W); p.y = rnd(0, H); p.r = rnd(3, 11);
          p.life = -((Math.random() * 120) | 0); p.max = rnd(40, 90);
        },
        step(p) { p.life++; return p.life < p.max; },
        draw(p) {
          if (p.life < 0) return;
          const t2 = p.life / p.max;
          const k = Math.sin(t2 * Math.PI);                 // in and back out
          const r = p.r * k;
          ctx.beginPath();
          ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y);
          ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x, p.y + r);
          ctx.strokeStyle = rgba(p.c, 0.75 * k); ctx.lineWidth = 1.3;
          ctx.lineCap = 'round'; ctx.stroke();
        }
      },

      // Psychic - orbs on slow wide orbits, leaving a soft glow.
      orbs: {
        count: 22, blend: 'lighter',
        spawn(p) {
          p.cx = rnd(0, W); p.cy = rnd(0, H);
          p.rad = rnd(30, 130); p.a = rnd(0, TAU); p.va = rnd(-0.012, 0.012);
          p.r = rnd(2, 6); p.max = rnd(400, 800); p.life = 0;
        },
        step(p) {
          p.life++; p.a += p.va;
          p.x = p.cx + Math.cos(p.a) * p.rad;
          p.y = p.cy + Math.sin(p.a) * p.rad * 0.55;
          return p.life < p.max;
        },
        draw(p) {
          const k = Math.sin((p.life / p.max) * Math.PI);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
          g.addColorStop(0, rgba(p.c, 0.55 * k));
          g.addColorStop(1, rgba(p.c, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, TAU); ctx.fill();
        }
      },

      // Ghost / Poison / Dark - big soft blobs creeping upward.
      wisps: {
        count: 18, blend: 'source-over',
        spawn(p) {
          p.x0 = rnd(0, W); p.x = p.x0; p.y = H + rnd(0, H * 0.3);
          p.r = rnd(18, 58); p.vy = -rnd(0.1, 0.35);
          p.max = rnd(500, 900); p.life = 0; p.ph = rnd(0, TAU); p.amp = rnd(10, 34);
        },
        step(p) {
          p.life++; p.y += p.vy;
          p.x = p.x0 + Math.sin(p.life * 0.01 + p.ph) * p.amp;
          return p.life < p.max && p.y > -80;
        },
        draw(p) {
          const k = Math.sin((p.life / p.max) * Math.PI);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          g.addColorStop(0, rgba(p.c, 0.28 * k));
          g.addColorStop(1, rgba(p.c, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
        }
      },

      // Rock / Ground / Steel / Normal - dust hanging in the air.
      motes: {
        count: 46, blend: 'source-over',
        spawn(p) {
          p.x = rnd(0, W); p.y = rnd(0, H);
          p.r = rnd(0.8, 2.6); p.vx = rnd(-0.18, 0.18); p.vy = rnd(-0.14, 0.06);
          p.max = rnd(400, 800); p.life = 0;
        },
        step(p) { p.life++; p.x += p.vx; p.y += p.vy; return p.life < p.max; },
        draw(p) {
          const k = Math.sin((p.life / p.max) * Math.PI);
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fillStyle = rgba(p.c, 0.5 * k); ctx.fill();
        }
      },

      // Flying / Dragon / Fighting - speed lines tearing across.
      streaks: {
        count: 26, blend: 'source-over',
        spawn(p) {
          p.y = rnd(0, H); p.x = rnd(-W * 0.2, W);
          p.len = rnd(30, 130); p.vx = rnd(1.6, 5.0);
          p.max = rnd(120, 260); p.life = 0; p.w = rnd(0.8, 2.0);
        },
        step(p) { p.life++; p.x += p.vx; return p.life < p.max && p.x < W + 160; },
        draw(p) {
          const k = Math.sin((p.life / p.max) * Math.PI);
          const g = ctx.createLinearGradient(p.x - p.len, p.y, p.x, p.y);
          g.addColorStop(0, rgba(p.c, 0));
          g.addColorStop(1, rgba(p.c, 0.5 * k));
          ctx.strokeStyle = g; ctx.lineWidth = p.w; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(p.x - p.len, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
      }
    };

    // Dual types tint roughly a third of the particles with the second colour,
    // so a Grass/Poison Bulbasaur drops mostly green leaves with purple ones
    // mixed through instead of picking a winner.
    function tint() { return colors[Math.random() < 0.68 ? 0 : (colors[1] ? 1 : 0)]; }

    function frame() {
      raf = null;
      if (!kind) return;
      const b = B[kind];
      ctx.clearRect(0, 0, W, H);
      // 'lighter' is additive: gorgeous as a glow on a dark page, and completely
      // invisible on a light one, where adding light to near-white does nothing.
      // So the glow behaviours fall back to normal compositing in light mode.
      ctx.globalCompositeOperation = (b.blend === 'lighter' && !isDark()) ? 'source-over' : b.blend;
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (!b.step(p)) { b.spawn(p); p.c = tint(); }       // recycle, never allocate
        else b.draw(p);
      }
      ctx.globalCompositeOperation = 'source-over';
      loop();
    }
    function loop() {
      // Nothing to draw, or the tab is in the background: stop burning frames.
      if (raf || !kind || document.hidden) return;
      raf = requestAnimationFrame(frame);
    }

    function start(k, cols) {
      kind = k; colors = cols;
      const b = B[k];
      parts = new Array(b.count);
      for (let i = 0; i < b.count; i++) {
        const p = {}; b.spawn(p); p.c = tint();
        // Fast-forward each particle a random distance into its own life, so the
        // field arrives already in motion rather than as an empty screen that
        // slowly fills from the spawn edge.
        const warm = (Math.random() * p.max * 0.8) | 0;
        for (let s = 0; s < warm; s++) { if (!b.step(p)) { b.spawn(p); break; } }
        parts[i] = p;
      }
      canvas.style.opacity = '1';
      loop();
    }
    function stop() {
      canvas.style.opacity = '0';
      kind = null; parts = [];
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      ctx.clearRect(0, 0, W, H);
    }

    function set(types) {
      const t1 = types && types[0], t2 = types && types[1];
      const k = FX_FOR_TYPE[t1], c1 = TYPE_COLORS[t1];
      clearTimeout(swap);
      if (!k || !c1) { canvas.style.opacity = '0'; swap = setTimeout(stop, 450); return; }
      const cols = [c1, TYPE_COLORS[t2] || null];
      if (k === kind && cols[0] === colors[0] && cols[1] === colors[1]) return;
      if (!kind) return start(k, cols);                     // nothing showing - no need to fade
      canvas.style.opacity = '0';                           // fade out, swap, fade back in
      swap = setTimeout(() => { ctx.clearRect(0, 0, W, H); start(k, cols); }, 450);
    }

    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', loop);
    return { set: set };
  })();

  let current = null;
  let objectUrl = null;

  function setFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showError("That's not an image. Try a JPG, PNG or WEBP.");
      return;
    }
    current = file;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);

    dropInner.innerHTML = '';
    const img = new Image();
    img.src = objectUrl;
    img.alt = 'Selected image';
    dropInner.appendChild(img);

    filenameEl.textContent = file.name || 'pasted image';
    identifyBtn.disabled = false;
    clearBtn.hidden = false;
    reset();
  }

  function clearAll() {
    current = null;
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    dropInner.innerHTML =
      '<svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/>' +
      '<path d="M12 5v13"/></svg>' +
      '<strong>Drop an image here</strong>' +
      '<small>or click to browse &middot; or paste with Ctrl&#8202;+&#8202;V</small>';
    filenameEl.textContent = '';
    identifyBtn.disabled = true;
    clearBtn.hidden = true;
    fileInput.value = '';
    reset();
  }

  function reset() {
    result.innerHTML = '<div class="placeholder">The answer will appear here.</div>';
    paintBackground([]);
    if (window.pokeViewer) window.pokeViewer.hide();
  }
  function showLoading() {
    result.innerHTML = '<div class="placeholder"><div><div class="spinner"></div>Thinking…</div></div>';
  }
  function showError(msg) {
    result.innerHTML = '<div class="placeholder"><div><p class="eyebrow">Something went wrong</p>' +
      '<div class="note error">' + escapeHtml(msg) + '</div></div></div>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function render(data) {
    const preds = data.predictions || [];
    if (!preds.length) { showError('The model returned nothing.'); return; }
    const top = preds[0];
    const pct = v => (v * 100).toFixed(1) + '%';

    // Types are a lookup on the predicted name, done server-side - not a second
    // thing the model guessed at. Older deploys may not send them at all.
    const types = top.types || [];
    const pills = types.length
      ? '<div class="types">' + types.map(function (ty) {
          const c = TYPE_COLORS[ty] || '#8a8f9e';
          return '<span class="type-pill" style="background:' + c +
                 ';color:' + readableOn(c) + '">' + escapeHtml(ty) + '</span>';
        }).join('') + '</div>'
      : '';

    let html =
      '<p class="eyebrow">It looks like</p>' +
      '<h2 class="answer">' + escapeHtml(top.name) + '</h2>' +
      pills +
      '<p class="conf"><b>' + pct(top.confidence) + '</b> confident' +
      ' &middot; ' + data.elapsed_ms + ' ms</p>' +
      '<div class="bars">';

    preds.forEach((p, i) => {
      html +=
        '<div class="bar-row">' +
          '<span class="bar-name" title="' + escapeHtml(p.name) + '">' + escapeHtml(p.name) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" data-w="' + (p.confidence * 100) +
            '" style="background:' + BARS[Math.min(i, BARS.length - 1)] + '"></span></span>' +
          '<span class="bar-val">' + pct(p.confidence) + '</span>' +
        '</div>';
    });
    html += '</div>';

    if (top.confidence < 0.4) {
      html += '<div class="note">Low confidence. The model always picks one of its ' +
              'classes even when the picture is not a Pokémon it knows — treat this as a guess.</div>';
    }
    result.innerHTML = html;
    paintBackground(types);
    // The viewer is an ES module, so it registers itself after this script has
    // parsed. Optional-call it: on a slow connection a prediction could in
    // principle land first, and a missing 3D model must never break the answer.
    if (window.pokeViewer) window.pokeViewer.show(top.dex, top.name);

    requestAnimationFrame(() => {
      result.querySelectorAll('.bar-fill').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
    });
  }

  // Serverless hosts cap request bodies (Vercel: 4.5 MB) and phone photos blow
  // straight past it. The model centre-crops to 224px anyway, so the full-size
  // original was always wasted bytes. Falls back to the untouched file on any error.
  const MAX_SIDE = 640;
  const SHRINK_ABOVE_BYTES = 1.5 * 1024 * 1024;

  function shrink(file) {
    return new Promise(resolve => {
      if (file.size < SHRINK_ABOVE_BYTES) return resolve(file);
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          // White first: a transparent PNG drawn straight to JPEG turns its
          // transparency BLACK, which is exactly the artefact the model was
          // trained not to see.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(
            blob => resolve(blob || file),
            'image/jpeg', 0.92
          );
        } catch (e) { resolve(file); }
        finally { URL.revokeObjectURL(url); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function identify() {
    if (!current) return;
    showLoading();
    identifyBtn.disabled = true;
    try {
      const payload = await shrink(current);
      const body = new FormData();
      body.append('image', payload, current.name || 'pasted.png');
      const res = await fetch('/api/predict', { method: 'POST', body });
      const data = await res.json().catch(() => ({ error: 'The server sent something unreadable.' }));
      if (!res.ok) { showError(data.error || ('Server error ' + res.status)); return; }
      render(data);
    } catch (err) {
      showError('Could not reach the server. Is `python -m src.app` still running?');
    } finally {
      identifyBtn.disabled = !current;
    }
  }

  // While a model is on screen the drop zone is a 3D viewport, not a file
  // picker - clicking to orbit must not pop open a file dialog.
  drop.addEventListener('click', () => {
    if (!drop.classList.contains('is-model')) fileInput.click();
  });
  drop.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', e => setFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt =>
    drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(evt =>
    drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('is-over'); }));
  drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  document.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) setFile(item.getAsFile());
  });

  identifyBtn.addEventListener('click', identify);
  clearBtn.addEventListener('click', clearAll);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && current && document.activeElement !== drop) identify();
  });

  fetch('/api/info').then(r => r.json()).then(d => {
    meta.innerHTML =
      '<span>model: ' + escapeHtml(d.model) + '</span>' +
      '<span>' + d.classes + ' classes</span>' +
      '<span>' + escapeHtml(d.device) + '</span>' +
      '<span>' + escapeHtml(d.checkpoint) + '</span>';
  }).catch(() => {});
})();
</script>
<script type="module">
/* ---------------------------------------------------------------------------
   3D model viewer.

   After a prediction the drop zone stops showing the photo you uploaded and
   shows the predicted Pokemon's actual 3D model instead, on a transparent
   background so the type gradient and particles show through behind it.

   Models come from github.com/Pokemon-3D-api/assets, addressed by National Dex
   number - which is why the API now returns a `dex` field next to `types`.
   They are Draco-compressed with WebP textures, so the loader needs a Draco
   decoder wired up; three.js handles EXT_texture_webp natively.

   Everything here fails soft. No dex number, no model in the repo, no WebGL,
   CDN unreachable - each one falls back to the uploaded photo and leaves the
   prediction itself untouched.
--------------------------------------------------------------------------- */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Swap this for https://cdn.jsdelivr.net/gh/Pokemon-3D-api/assets@main/models/opt/regular/
// if raw.githubusercontent starts rate-limiting - jsDelivr is a real CDN and
// caches, raw.githubusercontent is not meant to be used as one.
const MODEL_BASE = 'https://raw.githubusercontent.com/Pokemon-3D-api/assets/main/models/opt/regular/';
const DRACO_PATH = 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/';

const drop     = document.getElementById('drop');
const stage    = document.getElementById('stage');
const hint     = document.getElementById('stageHint');
const toggleBt = document.getElementById('toggle3d');

let renderer, scene, camera, controls, raf = null;
let model = null, msgEl = null, token = 0, showing = false, hasModel = false;

function msg(text) {
  if (!msgEl) { msgEl = document.createElement('div'); msgEl.className = 'stage-msg'; stage.appendChild(msgEl); }
  msgEl.textContent = text;
  msgEl.hidden = !text;
}

// WebGL contexts are a limited resource and starting one costs real time, so
// the whole renderer is built on first use rather than at page load - a visitor
// who never runs a prediction never pays for it.
function init() {
  if (renderer) return true;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
  } catch (e) { return false; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearAlpha(0);                       // transparent, as asked
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  scene = new THREE.Scene();                       // no background => page shows through
  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);

  // These are PBR models from Sketchfab; lighting them with a couple of point
  // lights looks flat and plasticky. A generated room environment gives them
  // something to actually reflect, which is most of what makes them read as 3D.
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(2.5, 4, 3);
  scene.add(key);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.6;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  new ResizeObserver(resize).observe(stage);
  return true;
}

function resize() {
  if (!renderer || stage.hidden) return;   // hidden => clientWidth 0 => pointless 1x1 buffer
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function loop() {
  raf = requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
function play() { if (!raf) loop(); }
function pause() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

// Every GPU resource a glTF allocates has to be released by hand - dropping the
// JS reference alone leaks VRAM, and this page can swap models all day.
function disposeModel() {
  if (!model) return;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    for (const m of [].concat(o.material || [])) {
      for (const k in m) {
        const v = m[k];
        if (v && v.isTexture) v.dispose();
      }
      m.dispose?.();
    }
  });
  scene.remove(model);
  model = null;
}

// Models arrive at wildly different scales and origins, so nothing can be
// hard-coded: measure the bounding box, recentre it on the origin, and pull the
// camera back by the box's own size.
function frameModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const extent = Math.max(size.x, size.y, size.z) || 1;

  obj.position.sub(center);
  obj.position.y += size.y * 0.02;

  const dist = (extent / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.5;
  camera.near = extent / 100;
  camera.far  = extent * 100;
  camera.position.set(dist * 0.35, extent * 0.12, dist);
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.minDistance = dist * 0.35;
  controls.maxDistance = dist * 3;
  controls.update();
}

let loader = null;
function getLoader() {
  if (loader) return loader;
  const draco = new DRACOLoader().setDecoderPath(DRACO_PATH);
  loader = new GLTFLoader().setDRACOLoader(draco);
  return loader;
}

function showStage(on) {
  stage.hidden = !on;
  hint.hidden = !on;
  drop.classList.toggle('is-model', on);
  toggleBt.hidden = !hasModel;
  toggleBt.textContent = on ? 'Show photo' : 'Show 3D';
  showing = on;
  if (on) { resize(); play(); } else { pause(); }
}

function hide() {
  token++;                       // invalidate any in-flight load
  hasModel = false;
  showStage(false);
  toggleBt.hidden = true;
  if (renderer) disposeModel();
  msg('');
}

async function show(dex, name) {
  if (!dex) { hide(); return; }             // Pokemon with no dex number - keep the photo
  if (!init()) { hide(); return; }          // no WebGL on this device

  const mine = ++token;
  hasModel = true;
  showStage(true);
  disposeModel();
  msg('Loading ' + (name || 'model') + '…');

  try {
    const gltf = await getLoader().loadAsync(MODEL_BASE + dex + '.glb');
    if (mine !== token) return;             // a newer prediction landed while we waited
    model = gltf.scene;
    scene.add(model);
    frameModel(model);
    controls.autoRotate = true;
    msg('');
  } catch (err) {
    if (mine !== token) return;
    // Missing model, offline, blocked CDN - say so quietly and hand the panel
    // back to the photo. The prediction is still perfectly good.
    console.warn('[3d] could not load model', dex, err);
    msg('');
    hasModel = false;
    showStage(false);
    toggleBt.hidden = true;
  }
}

toggleBt.addEventListener('click', e => {
  e.stopPropagation();
  showStage(!showing);
});

// A spinning model in a background tab is pure battery burn.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pause(); else if (showing) play();
});

window.pokeViewer = { show, hide };
</script>
</body>
</html>
